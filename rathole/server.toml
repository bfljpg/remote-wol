# ============================================================
# Rathole Server Yapılandırması (VPS üzerinde çalışır)
# NOT: Docker Compose ile çalıştırıyorsanız bu dosya yerine doğrudan
# .env dosyasındaki RATHOLE_PORT ve RATHOLE_TOKEN kullanılır.
# Bu dosya Docker'sız (manuel veya systemd) kurulumlar içindir.
# ============================================================

[server]
bind_addr = "0.0.0.0:2333"    # Client'ların bağlanacağı port

[server.services.wol-agent]
token = "CHANGE_ME_SECURE_TOKEN_HERE"    # Client ile aynı token olmalı
bind_addr = "0.0.0.0:9090"               # Agent servisi bind adresi

