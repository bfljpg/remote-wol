services:
  # Web uygulaması (Go backend + embedded frontend)
  wol-app:
    build: .
    container_name: remote-wol
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - wol-data:/app/data
    env_file:
      - .env
    environment:
      - AGENT_URL=http://rathole-server:9090
    depends_on:
      - rathole-server
    restart: unless-stopped

  # Rathole tünel sunucusu
  rathole-server:
    image: rapiz1/rathole:latest
    container_name: rathole-server
    ports:
      - "${RATHOLE_PORT:-2333}:${RATHOLE_PORT:-2333}"
    configs:
      - source: rathole_config
        target: /app/config.toml
    command: ["--server", "/app/config.toml"]
    restart: unless-stopped

configs:
  rathole_config:
    content: |
      [server]
      bind_addr = "0.0.0.0:${RATHOLE_PORT:-2333}"

      [server.services.wol-agent]
      token = "${RATHOLE_TOKEN:-change-me-rathole-token}"
      bind_addr = "0.0.0.0:9090"

volumes:
  wol-data:
